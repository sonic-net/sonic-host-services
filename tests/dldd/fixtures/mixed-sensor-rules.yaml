# Compact DUT validation rules. Sensor inventory and thresholds are discovered
# by the installed DSE hook at runtime; this file intentionally does not copy a
# device snapshot. The portable conformance corpus covers the complete schema.
schema_version: 0.0.1
signatures:
  - signature:
      metadata:
        name: DLDD_TEMPERATURE_HIGH_DSE
        id: 9999401
        version: 1.0.0
        description: Any temperature sensor reached its live high threshold.
        product_ids: [8102_28fh_dpu_o]
        sw_versions: [grboudre_dldd-impl.0-1d85491a7]
        component: TEMPERATURE_SENSOR
        symptom: SYMPTOM_OVER_THRESHOLD
        error_type: TEMPERATURE
        severity: WARNING
        tags: [dut-live, dse-temperature-sensors]
      conditions:
        logic: "1"
        logic_lookback_time: 120
        events:
          - event:
              id: 1
              type: dse
              path: "{temperature*}:{get_value()}"
              evaluation:
                type: dse
                value: "{temperature*}:{get_high_threshold()}"
              match_count: 1
              match_period: 0
              sampling_interval: 5
      actions:
        repair_actions:
          remote_actions:
            action_list: [ACTION_REPLACE]
            time_window: 3600

  - signature:
      metadata:
        name: DLDD_VOLTAGE_HIGH_DSE
        id: 9999402
        version: 1.0.0
        description: Any voltage sensor reached its live high threshold.
        product_ids: [8102_28fh_dpu_o]
        sw_versions: [grboudre_dldd-impl.0-1d85491a7]
        component: VOLTAGE_SENSOR
        symptom: SYMPTOM_OVER_THRESHOLD
        error_type: POWER
        severity: WARNING
        tags: [dut-live, dse-voltage-sensors]
      conditions:
        logic: "1"
        logic_lookback_time: 120
        events:
          - event:
              id: 1
              type: dse
              path: "{voltage*}:{get_value()}"
              evaluation:
                type: dse
                value: "{voltage*}:{get_high_threshold()}"
              match_count: 1
              match_period: 0
              sampling_interval: 5
      actions:
        repair_actions:
          remote_actions:
            action_list: [ACTION_REPLACE]
            time_window: 3600

  - signature:
      metadata:
        name: DLDD_CURRENT_HIGH_DSE
        id: 9999403
        version: 1.0.0
        description: Any current sensor reached its live high threshold.
        product_ids: [8102_28fh_dpu_o]
        sw_versions: [grboudre_dldd-impl.0-1d85491a7]
        component: CURRENT_SENSOR
        symptom: SYMPTOM_OVER_THRESHOLD
        error_type: POWER
        severity: WARNING
        tags: [dut-live, dse-current-sensors]
      conditions:
        logic: "1"
        logic_lookback_time: 120
        events:
          - event:
              id: 1
              type: dse
              path: "{current*}:{get_value()}"
              evaluation:
                type: dse
                value: "{current*}:{get_high_threshold()}"
              match_count: 1
              match_period: 0
              sampling_interval: 5
      actions:
        repair_actions:
          remote_actions:
            action_list: [ACTION_REPLACE]
            time_window: 3600

  - signature:
      metadata:
        name: DLDD_DUT_RULE_INSTANCE_BROKEN
        id: 9999302
        version: 1.0.0
        description: Deterministic runtime failure proving rule-instance output.
        product_ids: [8102_28fh_dpu_o]
        sw_versions: [grboudre_dldd-impl.0-1d85491a7]
        component: DLDD_RULE_INSTANCE_TEST
        symptom: SYMPTOM_UNKNOWN
        error_type: DIAGNOSTIC
        severity: UNKNOWN
        tags: [dut-live, runtime-broken-rule-instance]
      conditions:
        logic: "1"
        logic_lookback_time: 0
        events:
          - event:
              id: 1
              type: cli
              path:
                argv: [/usr/bin/printf, not-an-integer]
                timeout: 5
              evaluation:
                type: mask
                logic: "&"
                value: "0x01"
                value_configs: {type: string, unit: N/A}
              sampling_interval: 30
              match_count: 1
              match_period: 0
      actions:
        repair_actions:
          remote_actions:
            action_list: [ACTION_REPLACE]
            time_window: 3600

  - signature:
      metadata:
        name: DLDD_DUT_ACTIVE_TEST
        id: 9999301
        version: 1.0.0
        description: Synthetic DUT rule used to verify active fault publication.
        product_ids: [8102_28fh_dpu_o]
        sw_versions: [grboudre_dldd-impl.0-1d85491a7]
        component: DLDD_TEST_SENSOR
        symptom: SYMPTOM_OVER_THRESHOLD
        error_type: DIAGNOSTIC
        severity: WARNING
        tags: [dut-live, deterministic-active-fault]
      conditions:
        logic: "1"
        logic_lookback_time: 0
        events:
          - event:
              id: 1
              type: redis
              instances: [DLDD_ACTIVE_TEST:DLDD_TEST_SENSOR|DLDD_ACTIVE_TEST]
              sampling_interval: 1
              path:
                database: STATE_DB
                table: DLDD_TEST_SENSOR
                key: DLDD_TEST_SENSOR|DLDD_ACTIVE_TEST
                path: value
              evaluation:
                type: comparison
                operator: ">="
                value: 1
                value_configs: {type: int, unit: state}
              match_count: 1
              match_period: 0
      actions:
        repair_actions:
          remote_actions:
            action_list: [ACTION_REPLACE]
            time_window: 3600
