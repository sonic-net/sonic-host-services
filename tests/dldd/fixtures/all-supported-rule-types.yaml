                chip_addr: "0x51"
                i2c_type: get
                command: "0x02"
                size: w
              evaluation:
                type: comparison
                operator: ">="
                value: [1, 2]
                value_configs: {type: int, unit: count}
              match_count: 1
              match_period: 0
          - event:
              id: 3
              type: i2c
              path:
                bus: corpus-bus-2
