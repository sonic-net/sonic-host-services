  - signature:
      metadata:
        name: DLDD_CORPUS_ACTION_QUERY_AND_IDENTITY_TYPES
        id: 9901501
        version: 1.0.0
        description: Covers every local action and query wire shape plus extensible identities.
        product_ids: [TEST-PRODUCT]
        sw_versions: [TEST-SOFTWARE]
        component: VENDOR_CORPUS_COMPONENT
        symptom: SYMPTOM_UNKNOWN
        error_type: VENDOR_CORPUS_ERROR
        severity: UNKNOWN
        tags:
          - dldd-corpus
          - coverage-actions
          - coverage-queries
          - coverage-logs
          - coverage-metadata
          - custom-component-identity
          - custom-error-identity
          - custom-remediation-identity
          - action-cli
          - action-dse
          - action-i2c-get
          - action-i2c-set
          - action-vendor
          - query-cli
          - query-dse
          - query-i2c
          - query-vendor
          - action-timeout-inherited
          - action-timeout-explicit
          - boundary-wait-min
      conditions:
        logic: "1"
        logic_lookback_time: 0
        events:
          - event:
              id: 1
              type: redis
              path:
                database: STATE_DB
                table: DLDD_CORPUS
                key: DLDD_CORPUS|ACTIONS
                path: value
              evaluation:
                type: boolean
                value: true
                value_configs: {type: boolean, unit: N/A}
              match_count: 1
              match_period: 0
      actions:
        repair_actions:
          local_actions:
            wait_period: 0
            action_list:
              - action:
                  type: cli
                  argv: [/usr/bin/true]
                  max_output_bytes: 1024
              - action:
                  type: dse
                  command: "corpus:no_op()"
                  timeout: 5
              - action:
                  type: dse
                  command: corpus opaque action
                  timeout: 5
              - action:
                  type: i2c
                  path:
                    bus: corpus-bus-0
                    chip_addr: "0x50"
                    i2c_type: get
                    command: "0x01"
                    size: b
                  timeout: 5
              - action:
                  type: i2c
                  path:
                    bus: corpus-bus-1
                    chip_addr: "0x51"
                    i2c_type: set
                    command: "0x02"
                    size: w
                    value: "0x0001"
                  timeout: 5
              - action:
                  type: i2c
                  path:
                    bus: corpus-bus-2
                    chip_addr: "0x52"
                    i2c_type: get
                    command: "0x03"
                    size: l
                  timeout: 5
              - action:
                  type: corpus_vendor_action
                  timeout: 5
                  hook: corpus_vendor
                  operation_name: no_op
                  arguments: [one, 2, true]
          remote_actions:
            action_list:
              - ACTION_RESEAT
              - ACTION_WARM_REBOOT
              - ACTION_COLD_REBOOT
              - ACTION_POWER_CYCLE
              - ACTION_FACTORY_RESET
              - ACTION_REPLACE
              - "vendor-healthz:ACTION_REPAIR_CORPUS_COMPONENT"
            time_window: 86400
        log_collection:
          logs:
            - log: /tmp/dldd-corpus/log-one
            - log: /tmp/dldd-corpus/log-*
          queries:
            - query:
                type: cli
                argv: [/usr/bin/printf, corpus-query]
                timeout: 5
                max_output_bytes: 4096
            - query:
                type: dse
                command: "corpus:get_status()"
                timeout: 5
            - query:
                type: dse
                command: corpus opaque query
                timeout: 5
            - query:
                type: i2c
                path:
                  bus: corpus-bus-0
                  chip_addr: "0x50"
                  i2c_type: get
                  command: "0x01"
                  size: l
                timeout: 5
            - query:
