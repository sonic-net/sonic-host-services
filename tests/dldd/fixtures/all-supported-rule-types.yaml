      conditions:
        logic: "1 OR 2 OR 3"
        logic_lookback_time: 30
        events:
          - event:
              id: 1
              type: i2c
              path:
                bus: corpus-bus-0
                chip_addr: "0x50"
                i2c_type: get
                command: "0x01"
                size: b
              evaluation:
                type: mask
                logic: "&"
                value: "0x01"
                value_configs: {type: hex, unit: N/A}
