                value_configs: {type: float, unit: volts, scaling: 0.001, encoding: N/A}
              match_count: 1
              match_period: 0
          - event:
              id: 3
              type: redis
              path: {database: STATE_DB, table: DLDD_CORPUS, key: "DLDD_CORPUS|EVAL_GE", path: value}
              evaluation:
                type: comparison
                operator: ">="
                value: 10
                value_configs: {type: hex, unit: N/A}
              match_count: 1
              match_period: 0
          - event:
              id: 4
              type: redis
              path: {database: STATE_DB, table: DLDD_CORPUS, key: "DLDD_CORPUS|EVAL_LE", path: value}
              evaluation:
                type: comparison
                operator: "<="
                value: 10
                value_configs: {type: binary, unit: N/A}
              match_count: 1
              match_period: 0
          - event:
              id: 5
              type: redis
              path: {database: STATE_DB, table: DLDD_CORPUS, key: "DLDD_CORPUS|EVAL_EQ", path: value}
              evaluation:
                type: comparison
                operator: "=="
                value: ready
                value_configs: {type: string, unit: N/A, encoding: utf-8}
              match_count: 1
              match_period: 0
          - event:
              id: 6
              type: redis
              path: {database: STATE_DB, table: DLDD_CORPUS, key: "DLDD_CORPUS|EVAL_NE", path: value}
              evaluation:
                type: comparison
                operator: "!="
                value: raw
                value_configs: {type: bytes, unit: N/A, encoding: utf-8}
              match_count: 1
              match_period: 0
          - event:
              id: 7
              type: redis
              path: {database: STATE_DB, table: DLDD_CORPUS, key: "DLDD_CORPUS|EVAL_MASK", path: value}
              evaluation:
                type: mask
                logic: "&"
                value: "0x80"
                value_configs: {type: binary, unit: N/A}
              match_count: 1
              match_period: 0
          - event:
              id: 8
              type: redis
              path: {database: STATE_DB, table: DLDD_CORPUS, key: "DLDD_CORPUS|EVAL_CONTAINS", path: value}
              evaluation:
                type: string
                operator: contains
                value: fault
                case_sensitive: false
                value_configs: {type: string, unit: N/A}
              match_count: 1
              match_period: 0
          - event:
              id: 9
              type: redis
              path: {database: STATE_DB, table: DLDD_CORPUS, key: "DLDD_CORPUS|EVAL_EQUALS", path: value}
              evaluation:
                type: string
                operator: equals
                value: exact
                value_configs: {type: N/A, unit: N/A}
              match_count: 1
              match_period: 0
          - event:
              id: 10
              type: redis
              path: {database: STATE_DB, table: DLDD_CORPUS, key: "DLDD_CORPUS|EVAL_REGEX", path: value}
              evaluation:
                type: string
                operator: regex
                value: "^fault-[0-9]+$"
                value_configs: {type: json, unit: N/A}
              match_count: 1
              match_period: 0
          - event:
              id: 11
              type: redis
              path: {database: STATE_DB, table: DLDD_CORPUS, key: "DLDD_CORPUS|EVAL_BOOLEAN", path: value}
              evaluation:
                type: boolean
                value: true
                value_configs: {type: boolean, unit: N/A}
              match_count: 1
              match_period: 0
          - event:
              id: 12
              type: redis
              path: {database: STATE_DB, table: DLDD_CORPUS, key: "DLDD_CORPUS|EVAL_DSE_PLACEHOLDER", path: value}
              evaluation:
                type: dse
                value: "direct_sensor:get_fixed_threshold()"
                value_configs: {type: N/A, unit: N/A}
              match_count: 1
              match_period: 0
      actions:
        repair_actions:
          remote_actions:
            action_list: [ACTION_REPLACE]
            time_window: 300

