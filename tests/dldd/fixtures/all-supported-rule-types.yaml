# Qualification-only corpus for the complete schema 0.0.1 positive surface.
#
# This file is intentionally hardware neutral. Tests install controlled Redis,
# file, I2C, Platform API, vendor-operation, and DSE doubles before attempting
# materialization or execution. It must not be installed as a daemon ruleset on
# a production device. YAML aliases are deliberately avoided because the DLDD
# parser rejects them.
schema_version: 0.0.1
local_action_default_timeout: 30
signatures:
  - signature:
      metadata:
        name: DLDD_CORPUS_LOGIC_PRECEDENCE_AND_CADENCE
        id: 9901001
        version: 1.0.0
        description: Covers unparenthesized AND/OR precedence and cadence modes.
        product_ids: [TEST-PRODUCT]
        sw_versions: [TEST-SOFTWARE]
        component: DLDD_CORPUS_COMPONENT
        symptom: SYMPTOM_OVER_THRESHOLD
        error_type: DLDD_CORPUS
        severity: CRITICAL
        priority: 0
        tags:
          - dldd-corpus
          - coverage-logic
          - logic-and
          - logic-or
          - logic-precedence
          - lookback-current
          - cadence-inherited
          - cadence-explicit
          - async
          - async-omitted
          - async-false
          - async-true
          - boundary-priority-min
          - boundary-lookback-min
          - boundary-sampling-min
      conditions:
        logic: "1 OR 2 AND 3"
        logic_lookback_time: 0
        events:
          - event:
              id: 1
              type: redis
              path:
                database: STATE_DB
                table: DLDD_CORPUS
                key: DLDD_CORPUS|LOGIC_1
                path: value
              evaluation:
                type: comparison
                operator: ">"
                value: 10
                value_configs:
                  type: int
                  unit: N/A
              match_count: 1
              match_period: 0
          - event:
              id: 2
              type: redis
              path:
                database: STATE_DB
                table: DLDD_CORPUS
                key: DLDD_CORPUS|LOGIC_2
                path: value
              evaluation:
                type: comparison
                operator: "<"
                value: 10
                value_configs:
                  type: int
                  unit: N/A
              sampling_interval: 1
              async: false
              match_count: 1
              match_period: 0
          - event:
              id: 3
              type: redis
              path:
                database: STATE_DB
                table: DLDD_CORPUS
                key: DLDD_CORPUS|LOGIC_3
                path: value
              evaluation:
                type: comparison
                operator: ">="
                value: 10
                value_configs:
                  type: int
                  unit: N/A
              sampling_interval: 1
              async: true
              match_count: 1
              match_period: 0
      actions:
        repair_actions:
          remote_actions:
            action_list: [ACTION_REPLACE]
            time_window: 60

