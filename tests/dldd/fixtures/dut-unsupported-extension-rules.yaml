# WARNING: QUALIFICATION-ONLY RULES. DO NOT INSTALL THIS FILE AS THE DAEMON'S
# ACTIVE RULESET. It deliberately contains localized platform-extension
# failures and is intended only for on-demand DLDD CLI validation on the
# identified DUT software generation.
schema_version: "0.0.1"
signatures:
  - signature:
      metadata:
        name: DLDD_DUT_EXTENSION_CONTROL
        id: 9999219
        version: "1.0.0"
        description: Deterministic Redis control for the extension-negative catalog.
        product_ids: [8102_28fh_dpu_o]
        sw_versions: [grboudre_dldd-impl.0-1d85491a7]
        component: DLDD_QUALIFICATION
        symptom: SYMPTOM_UNKNOWN
        error_type: DLDD_TEST
        severity: UNKNOWN
        tags: [dldd-dut-qualification, extension-control]
      conditions:
        logic: "1"
        logic_lookback_time: 0
        events:
          - event:
              id: 1
              type: redis
              path:
                database: STATE_DB
                table: DLDD_TEST_SENSOR
                key: "DLDD_TEST_SENSOR|DLDD_ACTIVE_TEST"
                path: value
              evaluation:
                type: comparison
                operator: "=="
                value: 1
                value_configs: {type: int, unit: state}
              match_count: 1
              match_period: 0
      actions:
        repair_actions:
          remote_actions:
            action_list: [ACTION_REPLACE]
            time_window: 3600

