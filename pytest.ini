[pytest]
addopts = --cov=scripts --cov=host_modules --cov=dldd --cov-branch --cov-report html --cov-report term-missing --cov-report xml --ignore=tests/*/test*_vectors.py --junitxml=test-results.xml -m "not dldd_integration" -vv
markers =
    dldd_integration: real service lifecycle with deterministic external fakes
